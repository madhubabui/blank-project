<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Register - PPP Operations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        form { max-width: 360px; margin: 40px auto; border: 1px solid #ddd; padding: 16px; border-radius: 6px; }
        input, select, button { width: 100%; padding: 8px; margin: 6px 0; }
        h1 { text-align: center; }
        .error { color: #c00; margin: 8px 0; }
    </style>
</head>
<body>
<h1>Register</h1>
<form method="post" th:object="${form}">
    <div class="error" th:text="${error}"></div>
    <input type="text" th:field="*{username}" placeholder="Username" required />
    <input type="password" th:field="*{password}" placeholder="Password (min 4 chars)" required />
    <select th:field="*{role}">
        <option value="VIEWER">Viewer</option>
        <option value="COORDINATOR">Coordinator</option>
        <option value="ADMIN">Admin</option>
    </select>
    <button type="submit">Create Account</button>
</form>
<p style="text-align:center"><a href="/login">Back to login</a></p>
</body>
</html>
