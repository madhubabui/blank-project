<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Financial Summary</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        nav a { margin-right: 12px; }
        table { border-collapse: collapse; width: 100%; margin-top: 16px; }
        th, td { border: 1px solid #ddd; padding: 8px; text-align: left; }
        th { background: #f5f5f5; }
        .summary { margin-top: 16px; }
        canvas { max-width: 800px; }
    </style>
    <script src="https://cdn.jsdelivr.net/npm/chart.js@4.4.1/dist/chart.umd.min.js"></script>
</head>
<body>
<nav>
    <a href="/">Dashboard</a>
    <a href="/partners">Partners</a>
    <a href="/projects">Projects</a>
    <a href="/reports/finance">Financial Summary</a>
</nav>

<h1>Financial Summary</h1>
<div class="summary">
    <p><strong>Total Contract Value:</strong> <span th:text="${totalContracts}">0</span></p>
    <p><strong>Total Payments:</strong> <span th:text="${totalPayments}">0</span></p>
</div>

<table>
    <thead>
    <tr><th>Project</th><th>Contracts Total</th><th>Payments Total</th></tr>
    </thead>
    <tbody>
    <tr th:each="p : ${projects}">
        <td th:text="${p.title}">Project</td>
        <td th:text="${#numbers.formatDecimal(#lists.sum(p.contracts.?[value]), 1, 'COMMA', 2, 'POINT')}">0</td>
        <td th:text="${#numbers.formatDecimal(#lists.sum(p.payments.?[amount]), 1, 'COMMA', 2, 'POINT')}">0</td>
    </tr>
    </tbody>
</table>

<h2>Payments by Project</h2>
<canvas id="paymentsChart"></canvas>
<script th:inline="javascript">
/*<![CDATA[*/
const labels = [[${projects.^map(p -> p.title)}]];
const data = [[${projects.^map(p -> #lists.sum(p.payments.?[amount]))}]];
const ctx = document.getElementById('paymentsChart');
new Chart(ctx, {
    type: 'bar',
    data: {
        labels: labels,
        datasets: [{ label: 'Payments', data: data, backgroundColor: '#4e79a7' }]
    },
    options: { responsive: true, scales: { y: { beginAtZero: true } } }
});
/*]]>*/
</script>
</body>
</html>
