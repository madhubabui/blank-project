<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Login - PPP Operations</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        form { max-width: 320px; margin: 40px auto; border: 1px solid #ddd; padding: 16px; border-radius: 6px; }
        input, button { width: 100%; padding: 8px; margin: 6px 0; }
        h1 { text-align: center; }
    </style>
</head>
<body>
<h1>Login</h1>
<form th:action="@{/login}" method="post">
    <input type="text" name="username" placeholder="Username" required />
    <input type="password" name="password" placeholder="Password" required />
    <button type="submit">Sign in</button>
</form>
<p style="text-align:center">Demo users: admin/admin, coord/coord, viewer/viewer</p>
</body>
</html>
