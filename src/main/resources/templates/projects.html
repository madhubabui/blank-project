<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>Projects</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 24px; }
        nav a { margin-right: 12px; }
        table { border-collapse: collapse; width: 100%; }
        th, td { border: 1px solid #ddd; padding: 8px; }
        th { background: #f5f5f5; text-align: left; }
        form { margin-top: 16px; }
        input, button { padding: 8px; }
        a.btn { display: inline-block; padding: 6px 10px; border: 1px solid #888; border-radius: 4px; text-decoration: none; }
    </style>
</head>
<body>
<nav>
    <a href="/">Dashboard</a>
    <a href="/partners">Partners</a>
    <a href="/projects">Projects</a>
</nav>
<h1>Projects</h1>
<table>
    <thead>
        <tr><th>ID</th><th>Title</th><th>Description</th><th>Partners</th><th>Contracts</th><th>Actions</th></tr>
    </thead>
    <tbody>
        <tr th:each="p : ${projects}">
            <td th:text="${p.id}">1</td>
            <td th:text="${p.title}">Title</td>
            <td th:text="${p.description}">Description</td>
            <td th:text="${#lists.size(p.partnerIds)}">0</td>
            <td th:text="${#lists.size(p.contracts)}">0</td>
            <td><a th:href="'/projects/' + ${p.id}" class="btn">View</a></td>
        </tr>
    </tbody>
</table>

<h2>Add Project</h2>
<form method="post" action="/projects">
    <input type="text" name="title" placeholder="Title" required />
    <input type="text" name="description" placeholder="Description" required />
    <button type="submit">Add</button>
</form>
</body>
</html>
